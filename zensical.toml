[project]
site_url = "https://n4vysh.github.io/dotfiles/"
site_name = "n4vysh/dotfiles"
site_description = "User-specific configuration files for Unix-like systems"
site_dir = ".zensical/site"
repo_url = "https://github.com/n4vysh/dotfiles"
repo_name = "n4vysh/dotfiles"
edit_uri = "edit/main/docs/"
strict = true
copyright = "© n4vysh"

nav = [
  { "Overview" = "index.md" },
  { "Getting started" = [
    { "Installation" = [
      "installation/index.md",
      { "Arch Linux" = "installation/arch-linux.md" },
      { "WSL2" = "installation/wsl2.md" },
    ] },
    { "Deploy and configure" = "usage.md" },
  ] },
  { "Keybindings" = [
    "keybindings/keyd.md",
    "keybindings/tmux.md",
    "keybindings/neovim.md",
    "keybindings/yazi.md",
    "keybindings/lazygit.md",
  ] },
  { "Applications" = "applications.md" },
  { "Screenshots" = "screenshots.md" },
  { "Contributing" = "https://github.com/n4vysh/dotfiles/blob/main/CONTRIBUTING.md" },
]

[project.theme]
custom_dir = ".zensical/overrides"
favicon = "assets/images/file-cog.svg"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/file-cog"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/n4vysh/dotfiles"
name = "GitHub"

[project.plugins.tags]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
