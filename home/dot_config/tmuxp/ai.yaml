session_name: ai
suppress_history: true
start_directory: $HOME
workspace_builder_options:
  pane_readiness: always
windows:
  - window_name: herdr
    layout: tiled
    panes:
      - shell_command:
          - cmd: herdr
  - window_name: tokscale
    layout: tiled
    panes:
      - shell_command:
          - cmd: |
              (sleep 1; tmux send-keys -t "$TMUX_PANE" Right) & exec tokscale
  - window_name: litellm
    layout: tiled
    panes:
      - shell_command:
          - cmd: |
              gopass ls --flat |
                grep -Fx envs/litellm/POSTGRES_PASSWORD >/dev/null ||
                systemd-creds decrypt \
                  --user \
                  --name=litellm-postgres-password \
                  ~/.config/credstore.encrypted/litellm-postgres-password - |
                  gopass insert envs/litellm/POSTGRES_PASSWORD
          - cmd: |
              gopass ls --flat |
                grep -Fx envs/litellm/DATABASE_URL >/dev/null ||
                printf 'postgresql://llmproxy:%s@127.0.0.1:54320/litellm\n' \
                  "$(gopass show -o envs/litellm/POSTGRES_PASSWORD)" |
                  gopass insert envs/litellm/DATABASE_URL
          - cmd: |
              gopass ls --flat |
                grep -Fx envs/litellm/LITELLM_MASTER_KEY >/dev/null ||
                openssl rand -base64 24 |
                  tr '/+' '_-' |
                  sed 's/^/sk-/' |
                  gopass insert envs/litellm/LITELLM_MASTER_KEY
          - cmd: mkdir -p "$XDG_CACHE_HOME/litellm"
          - cmd: |
              cat <<EOF >|"$XDG_CACHE_HOME/litellm/config.yaml"
              litellm_settings:
                drop_params: True
              model_list:
                - model_name: &model chatgpt/gpt-6-sol
                  model_info:
                    mode: responses
                  litellm_params:
                    model: *model
                    reasoning_effort:
                      effort: low
                    verbosity: low
                    additional_drop_params:
                      # for git-czg
                      # https://github.com/BerriAI/litellm/issues/15070
                      - top_p
              EOF
          # yamllint disable rule:line-length
          - cmd: |
              sed \
                "s|provider = \"prisma-client-py\"|provider = \"$(mise where pypi:litellm)/.mise-uv/.venv/bin/prisma-client-py\"|" \
                "$(mise where pypi:litellm)"/.mise-uv/.venv/lib/python*/site-packages/litellm/proxy/schema.prisma \
                >|"$XDG_CACHE_HOME/litellm/schema.prisma"
          # yamllint enable rule:line-length
          - cmd: |
              PATH="$(mise where pypi:litellm)/.mise-uv/.venv/bin:$PATH" \
                prisma generate --schema "$XDG_CACHE_HOME/litellm/schema.prisma"
          - cmd: |
              gopass env envs/litellm \
                env \
                STORE_MODEL_IN_DB=True \
                LITELLM_DROP_PARAMS=true \
                LITELLM_MODIFY_PARAMS=true \
                PATH="$(mise where pypi:litellm)/.mise-uv/.venv/bin:$PATH" \
                  litellm --config "$XDG_CACHE_HOME/litellm/config.yaml"
