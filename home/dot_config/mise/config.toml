#:schema https://mise.jdx.dev/schema/mise.json

[settings]
jobs = 20
minimum_release_age = "3d"
pin = true
lockfile = true
lockfile_platforms = ["linux-x64"]
disable_backends = ["asdf", "ubi"]

[settings.github]
credential_command = "/usr/sbin/gh auth token"

[settings.npm]
package_manager = "aube"

[shell_alias]
kubectl = "kubecolor"
assume = ". assume"

[env]
_.path = ["~/.krew/bin", "{{env.XDG_DATA_HOME}}/pnpm"]
BATS_LIB_PATH = "{{env.HOME}}/.local/share/bats"

# czg
CZ_EDITOR = 'cz-editor'
# pnpm
PNPM_HOME = "{{env.XDG_DATA_HOME}}/pnpm"
# Go
GOPATH = "{{env.HOME}}/.local"
# Terraform
TF_CLI_ARGS_plan = "-parallelism=30"
TF_CLI_ARGS_apply = "-parallelism=30"
# AWS
AWS_CLI_AUTO_PROMPT = "on-partial"
## aws-vault
AWS_VAULT_BACKEND = "pass"
AWS_VAULT_PASS_CMD = "gopass"
AWS_VAULT_PASS_PREFIX = "aws-vault"

[plugins]
"vfox-backend:http-deb" = "~/.config/mise/plugins/vfox-http-deb"

[bootstrap.packages]
"pacman:docker" = "latest"
"pacman:docker-buildx" = "latest"
"pacman:docker-compose" = "latest"
"pacman:skopeo" = "latest"
"pacman:drawio-desktop" = "latest"

[bootstrap.repos]
"~/.local/share/bats/bats-support" = { url = "https://github.com/bats-core/bats-support.git", ref = "v0.3.0" }
"~/.local/share/bats/bats-assert" = { url = "https://github.com/bats-core/bats-assert.git", ref = "v2.2.4" }
"~/.local/share/bats/bats-file" = { url = "https://github.com/bats-core/bats-file.git", ref = "v0.4.0" }

[bootstrap.hooks.post-packages]
run = '''
if ! id -nG "$USER" | grep -qw docker; then
  sudo usermod -aG docker "$USER"
fi
'''

[bootstrap.directories."/etc/docker"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/docker/daemon.json"]
source = "./files/etc/docker/daemon.json"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.services."docker.socket"]
state = "running"
enabled = true
on_change = "none"

[tools]
gh = "2.98.0"
gopass = "1.16.1"
cocogitto = { version = "7.0.0", postinstall = '''
cog generate-completions zsh >~/.zshrc.d/site-functions/_cog
''' }
bats = "1.14.0"
"pipx:pre-commit-hooks" = "6.0.0"
editorconfig-checker = "3.11.1"
typos = "1.49.0"
actionlint = "1.7.12"
"npm:eslint" = "10.9.0"
lychee = { version = "0.24.2", postinstall = '''
lychee --generate complete-zsh >~/.zshrc.d/site-functions/_lychee
''' }
prettier = "3.8.1"
rumdl = "0.2.60"
"aqua:Kampfkarren/selene" = "0.31.0"
shellcheck = "0.11.0"
"aqua:anordal/shellharden" = "4.3.2"
shfmt = "3.13.1"
"pipx:sqlfluff" = "4.3.0"
stylua = "2.5.2"
taplo = { version = "0.10.0", postinstall = '''
taplo completions zsh >~/.zshrc.d/site-functions/_taplo
''' }
yamlfmt = "0.21.0"
yamllint = "1.38.0"
zizmor = "1.29.0"
"npm:czg" = "1.13.0"
worktrunk = "0.23.2"
"npm:gitmoji-cli" = "9.6.0"
"github:YiNNx/cmd-wrapped" = { version = "0.4.1", bin = "cmd-wrapped" }
dyff = "1.10.1"
jqp = "0.7.0"
lefthook = "2.1.12"
"npm:@redocly/cli" = "1.34.3"
"npm:git-open" = "3.1.0"
"aqua:knqyf263/pet" = "1.0.1"
"go:github.com/hashicorp/hcl/v2/cmd/hclfmt" = "v2.24.0"
ls-lint = "2.3.1"
"npm:obsidian-headless" = { version = "0.0.14", allow_builds = [
  "better-sqlite3",
] }
"npm:renovate" = { version = "44.21.0", allow_builds = [
  "re2",
], trust_policy_excludes = [
  "@yarnpkg/libzip@3.2.2",
] }
fx = { version = "39.2.0", postinstall = '''
fx --comp zsh >~/.zshrc.d/site-functions/_fx
''' }
yq = { version = "4.53.3", postinstall = '''
yq shell-completion zsh >~/.zshrc.d/site-functions/_yq
''' }
jwt = { version = "6.2.0", postinstall = '''
jwt completion zsh >~/.zshrc.d/site-functions/_jwt
''' }
oxipng = "10.2.0"
"npm:@mermaid-js/mermaid-cli" = { version = "11.16.0", allow_builds = [
  "puppeteer",
], trust_policy_excludes = [
  "cytoscape@3.34.1",
] }

# docs
"pipx:zensical" = "0.0.57"

# AI
nono = { version = "0.74.0", postinstall = '''
nono completion zsh >~/.zshrc.d/site-functions/_nono
nono pull nolabs-ai/opencode
nono profile schema \
  --output "$(chezmoi source-path)/dot_config/nono/nono-profile.schema.json"
''' }
rtk = "0.43.0"
herdr = "0.8.2"
hunk = "0.17.0"
apm = "0.26.0"
"npm:ctx7" = "0.5.5"
"npm:skills" = "1.5.17"
"npm:agent-browser" = "0.27.0"
"pipx:semble" = "0.1.10"
"pipx:markitdown" = { version = "0.1.5", extras = "all" }
"npm:defuddle" = "0.18.1"
"pipx:litellm" = { version = "1.88.0", extras = "proxy,extra_proxy", uvx_args = "--python 3.13.14" }
## token tracker
"npm:tokscale" = "4.12.0"
## mcp
"pipx:mcp-proxy-for-aws" = "1.6.4"
"npm:kubernetes-mcp-server" = "0.0.66"
"go:github.com/hashicorp/terraform-mcp-server/cmd/terraform-mcp-server" = "1.2.0"
"pipx:mcp-grafana" = "1.1.0"
"aqua:github/github-mcp-server" = "1.10.1"

# app
## frontend
### TS
node = "24.11.0"
pnpm = { version = "11.3.0", postinstall = '''
pnpm completion zsh >~/.zshrc.d/site-functions/_pnpm
''' }
bun = { version = "1.3.14", postinstall = '''
bun completions >~/.zshrc.d/site-functions/_bun
''' }
"npm:@antfu/ni" = "28.0.0"
### CSS
"npm:stylelint" = "17.11.0"
"npm:stylelint-config-standard" = "40.0.0"
## backend
### go
go = "1.26.6"
gotestsum = "1.13.0"
"go:github.com/josharian/impl" = "1.4.0"
"go:github.com/fatih/gomodifytags" = "1.17.0"
golangci-lint = "2.1.6"
"go:github.com/cweill/gotests/..." = "1.6.0"
"aqua:go-delve/delve" = { version = "1.26.3", postinstall = '''
dlv completion zsh >~/.zshrc.d/site-functions/_dlv
''' }
gofumpt = "0.10.0"
"go:golang.org/x/tools/cmd/goimports" = "0.49.0"
### Python
python = "3.13.14"
uv = { version = "0.12.5", postinstall = '''
uv generate-shell-completion zsh >~/.zshrc.d/site-functions/_uv
''' }
ruff = { version = "0.16.3", postinstall = '''
ruff generate-shell-completion zsh >~/.zshrc.d/site-functions/_ruff
''' }
ty = { version = "0.0.72", postinstall = '''
ty generate-shell-completion zsh >~/.zshrc.d/site-functions/_ty
''' }

# infra
## cloud
awscli = { version = "2.36.31", postinstall = '''
cat >~/.zshrc.d/site-functions/_aws <<'EOF'
#compdef aws

if (( ! $+functions[_bash_complete] )); then
  autoload -Uz bashcompinit
  bashcompinit
fi

_bash_complete -C aws_completer
EOF
''' }
aws-vault = { version = "7.13.3", postinstall = '''
aws-vault --completion-script-zsh >~/.zshrc.d/site-functions/_aws-vault
''' }
granted = "0.38.0"
amazon-ecr-credential-helper = "0.9.1"

### session-manager-plugin
### NOTE: taplo not support multiline inline tables of TOML 1.1
###       https://github.com/tamasfe/taplo/issues/332
"http-deb:session-manager-plugin".version = "1.2.835.0"
"http-deb:session-manager-plugin".os = ["linux"]
"http-deb:session-manager-plugin".bin_path = "usr/local/sessionmanagerplugin/bin"
"http-deb:session-manager-plugin".version_list_url = "https://api.github.com/repos/aws/session-manager-plugin/releases"
"http-deb:session-manager-plugin".version_json_path = ".[].tag_name"
"http-deb:session-manager-plugin".platforms.linux-x64.url = "https://s3.amazonaws.com/session-manager-downloads/plugin/{{ version }}/ubuntu_64bit/session-manager-plugin.deb"
"http-deb:session-manager-plugin".platforms.linux-x64.checksum = "sha512:971613d4d937d356493b8469d8e442860a903c6c50313f308c5c87b6140d3873b8c345f6757636180ea18e3ae061b9df9cf19cd4541db8e238c527953d80addd"

## container
hadolint = "2.12.0"
crane = "0.21.9"
"github:docker/docker-credential-helpers" = { version = "0.9.3", asset_pattern = "docker-credential-pass-*.linux-amd64", bin = "docker-credential-pass" }
dive = "0.13.1"

## terraform
terraform = { version = "1.15.8", postinstall = '''
cat >~/.zshrc.d/site-functions/_terraform <<'EOF'
#compdef terraform

if (( ! $+functions[_bash_complete] )); then
  autoload -Uz bashcompinit
  bashcompinit
fi

_bash_complete -o nospace -C terraform
EOF
''' }
terraform-docs = "0.20.0"
terraform-ls = "0.38.1"
tflint = "0.64.0"
terragrunt = "1.1.1"

## kubernetes
argocd = { version = "3.4.2", postinstall = '''
argocd completion zsh >~/.zshrc.d/site-functions/_argocd
''' }
kubectl = { version = "1.36.3", postinstall = '''
kubectl completion zsh >~/.zshrc.d/site-functions/_kubectl
''' }
kubectx = { version = "0.11.0", postinstall = '''
tmp=$(mktemp)
trap 'rm -f "$tmp"' 0
curl \
  -fsSL \
  "https://raw.githubusercontent.com/ahmetb/kubectx/v${MISE_TOOL_VERSION}/completion/_kubectx.zsh" \
  -o "$tmp"
printf '%s  %s\n' '410b5315f7a91b1c210cbc86c9cc4dda065f2ac180b490f3ebbf7e764ab6b470' "$tmp" |
  sha256sum -c -
install -m 0644 "$tmp" ~/.zshrc.d/site-functions/_kubectx
''' }
kubens = { version = "0.11.0", postinstall = '''
tmp=$(mktemp)
trap 'rm -f "$tmp"' 0
curl \
  -fsSL \
  "https://raw.githubusercontent.com/ahmetb/kubectx/v${MISE_TOOL_VERSION}/completion/_kubens.zsh" \
  -o "$tmp"
printf '%s  %s\n' '084c226035af951e582020b2bc055a6521929ee54d8942b4d19577e5d45fd8f7' "$tmp" |
  sha256sum -c -
install -m 0644 "$tmp" ~/.zshrc.d/site-functions/_kubens
''' }
