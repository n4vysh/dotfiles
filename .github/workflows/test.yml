name: test
"on": push
jobs:
  chezmoi:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container:
      image: archlinux:base-20260802.0.566770
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate keyring and download database file
        run: pacman-key --init && pacman -Sy
      - name: Install git command for chezmoiexternal git-repo type
        run: pacman -S --noconfirm git
      - name: Install dotfiles manager
        run: pacman -S --noconfirm chezmoi
      - name: Setup dotfiles directory
        env:
          branch: ${{ github.ref_name }}
        run: chezmoi init --branch "$branch" n4vysh
      - name: Deploy dotfiles
        run: chezmoi apply
      - name: List dotfiles
        run: ls -l ~/.*
  lefthook:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          # TODO: remove once re2 includes the upstream Abseil header fix
          # https://github.com/abseil/abseil-cpp/issues/2072
          CXXFLAGS: "-include immintrin.h"
        with:
          # renovate: datasource=github-releases depName=jdx/mise
          version: "2026.9.12"
      - name: Run lefthook
        run: lefthook run pre-commit --all-files
