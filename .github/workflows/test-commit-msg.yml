name: main
"on": pull_request
jobs:
  cocogitto:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Define XDG_DATA_HOME for mise env
        run: echo "XDG_DATA_HOME=$HOME/.local/share" >>"$GITHUB_ENV"
      - name: Create zsh completion directory for mise postinstall
        run: mkdir -p "$HOME/.zshrc.d/site-functions"
      - name: Make source mise plugin discoverable
        run: |
          mkdir -p "$HOME/.config/mise/plugins"
          ln -s \
            "$GITHUB_WORKSPACE/home/dot_config/mise/plugins/vfox-http-deb" \
            "$HOME/.config/mise/plugins/vfox-http-deb"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_CONFIG_FILE: home/dot_config/mise/config.toml
        with:
          bootstrap: true
          bootstrap_args: --only task --yes
      - name: Validate PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cog check "$BASE_SHA..$HEAD_SHA"
