name: main
"on": push
jobs:
  chezmoi:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container:
      image: archlinux:base-20260802.0.566770
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate keyring and download database file
        run: pacman-key --init && pacman -Sy
      - name: Install git command for chezmoiexternal git-repo type
        run: pacman -S --noconfirm git
      - name: Install dotfiles manager
        run: pacman -S --noconfirm chezmoi
      - name: Deploy dotfiles
        env:
          branch: ${{ github.ref_name }}
        run: |
          chezmoi init --branch "$branch" n4vysh && chezmoi apply
          ls -l ~/.*
  lefthook:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Define XDG_DATA_HOME for mise env
        run: echo "XDG_DATA_HOME=$HOME/.local/share" >>"$GITHUB_ENV"
      - name: Create zsh completion directory for mise postinstall
        run: mkdir -p "$HOME/.zshrc.d/site-functions"
      - name: Make source mise plugin discoverable
        run: |
          mkdir -p "$HOME/.config/mise/plugins"
          ln -s \
            "$GITHUB_WORKSPACE/home/dot_config/mise/plugins/vfox-http-deb" \
            "$HOME/.config/mise/plugins/vfox-http-deb"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_CONFIG_FILE: home/dot_config/mise/config.toml
        with:
          bootstrap: true
          bootstrap_args: --only task --yes
      - name: Run lefthook
        run: lefthook run pre-commit --all-files
  cocogitto:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Define XDG_DATA_HOME for mise env
        run: echo "XDG_DATA_HOME=$HOME/.local/share" >>"$GITHUB_ENV"
      - name: Create zsh completion directory for mise postinstall
        run: mkdir -p "$HOME/.zshrc.d/site-functions"
      - name: Make source mise plugin discoverable
        run: |
          mkdir -p "$HOME/.config/mise/plugins"
          ln -s \
            "$GITHUB_WORKSPACE/home/dot_config/mise/plugins/vfox-http-deb" \
            "$HOME/.config/mise/plugins/vfox-http-deb"
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          MISE_CONFIG_FILE: home/dot_config/mise/config.toml
        with:
          bootstrap: true
          bootstrap_args: --only task --yes
      - name: Validate current commit (last commit)
        run: cog check HEAD~1..HEAD
