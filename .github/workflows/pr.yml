name: main
"on": pull_request
jobs:
  cocogitto:
    runs-on: ubuntu-26.04
    container:
      image: archlinux:base-20260802.0.566770
    permissions:
      contents: read
    steps:
      - name: Generate keyring and download database file
        run: pacman-key --init && pacman -Sy
      - name: Install cocogitto command
        run: pacman -S --noconfirm git cocogitto
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Validate PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cog check "$BASE_SHA..$HEAD_SHA"
